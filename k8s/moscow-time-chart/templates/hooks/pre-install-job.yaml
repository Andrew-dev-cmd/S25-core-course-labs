apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "moscow-time.fullname" . }}-pre-install"
  labels:
    {{- include "moscow-time.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "moscow-time.fullname" . }}-pre-install"
    spec:
      restartPolicy: Never
      containers:
        - name: pre-install
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Pre-install check running..."
              sleep 5
              echo "Pre-install completed successfully!"
