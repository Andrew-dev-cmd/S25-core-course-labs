apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moscow-time-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Andrew-dev-cmd/S25-core-course-labs.git
    targetRevision: lab13
    path: k8s/moscow-time-chart
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
